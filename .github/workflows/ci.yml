name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The interface is compiled into the dashboard, so a build that has not
      # built it produces a binary that cannot serve anything.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install interface dependencies
        run: make web-install

      - name: typecheck the interface
        run: cd web && pnpm typecheck

      - name: build the interface
        run: cd web && pnpm build

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: make vet

      - name: test
        run: make test

      - name: cross compile every target
        run: make build-all
