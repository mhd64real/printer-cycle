# cupsd configuration for the printer-cycle development container.
#
# This is a throwaway container on a developer's machine. It is not a template
# for production and it must never be exposed to a network.

LogLevel warn
MaxLogSize 0

# Listen on every interface so the Go client running natively on the host can
# reach it. The host maps this to 6631, because macOS runs its own cupsd on 631.
Listen 0.0.0.0:631

# Production talks to cupsd over its Unix socket, where peer credentials identify
# a user in the lpadmin group and no password is ever transmitted. TCP has no
# equivalent, so this container drops authentication entirely. That is closer to
# production than basic auth would be: in both cases core sends no credentials
# and admin operations succeed.
DefaultAuthType None
DefaultEncryption Never

Browsing Off
BrowseLocalProtocols none

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow all
</Location>

<Policy default>
  # Job privacy off, to match production rather than to weaken a test.
  #
  # CUPS redacts job-name and job-originating-user-name from any client it does
  # not consider the job's owner or a system user, returning the attributes
  # empty rather than refusing the request. In production core connects over the
  # Unix socket as a user in the lpadmin group, which CUPS treats as @SYSTEM, so
  # it sees the real values. This container has no authentication at all, so
  # without these two lines it would hide them and job listings would show blank
  # names for reasons that look nothing like the actual cause.
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit All>
    Order allow,deny
    Allow all
  </Limit>
</Policy>
